<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KanjiYome</title>
<style>
  body { margin:0; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:#f7f5f0; color:#1c1b1a; display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .card { max-width:26rem; margin:1.5rem; padding:2.5rem 2rem; background:#fffdfa; border:1px solid #e3ded4; border-radius:18px; text-align:center; }
  .mark { width:64px; height:64px; border-radius:50%; background:#2e7d32; color:#fff; font-size:2rem; line-height:64px; margin:0 auto 1.25rem; }
  h1 { font-size:1.35rem; margin:0 0 1.1rem; }
  p { font-size:.95rem; line-height:1.5; margin:.6rem 0; }
  .detail { color:#a33; font-size:.8rem; }
  .brand { margin-top:1.6rem; font-weight:700; color:#c8102e; letter-spacing:.02em; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark" id="mark">&#10003;</div>
    <h1 id="title"></h1>
    <p id="body"></p>
    <p class="detail" id="detail"></p>
    <div class="brand">KanjiYome</div>
  </div>
<script>
// Page de confirmation d'adresse (cible du lien d'inscription, via la
// redirection 302 de l'Edge function email-confirmed). La langue suit celle
// du NAVIGATEUR de la personne : français si l'appareil est en français,
// anglais sinon (langue de base de l'app). Supabase renvoie les échecs en
// query (?error=...&error_description=...) ; un succès met les jetons dans le
// fragment (invisible et inutile ici).
(function () {
  var isFr = (navigator.language || 'en').toLowerCase().indexOf('fr') === 0;
  var STR = {
    fr: {
      okTitle: 'Adresse confirmée',
      okBody: "Ton compte KanjiYome est actif. Retourne dans l'application : tu y seras connecté automatiquement (ou touche « Se connecter »).",
      errTitle: 'Lien invalide ou expiré',
      errBody: "Le lien de confirmation n'a pas pu être validé. Ouvre l'application et redemande un e-mail de confirmation."
    },
    en: {
      okTitle: 'Email confirmed',
      okBody: 'Your KanjiYome account is active. Go back to the app: you will be signed in automatically (or tap Sign in).',
      errTitle: 'Invalid or expired link',
      errBody: 'The confirmation link could not be validated. Open the app and request a new confirmation email.'
    }
  };
  var t = isFr ? STR.fr : STR.en;
  document.documentElement.lang = isFr ? 'fr' : 'en';
  var q = new URLSearchParams(location.search);
  var err = q.get('error_description') || q.get('error');
  if (err) {
    var m = document.getElementById('mark');
    m.innerHTML = '&#9888;';
    m.style.background = '#b26a00';
    document.getElementById('title').textContent = t.errTitle;
    document.getElementById('body').textContent = t.errBody;
    document.getElementById('detail').textContent = String(err).slice(0, 200);
  } else {
    document.getElementById('title').textContent = t.okTitle;
    document.getElementById('body').textContent = t.okBody;
  }
})();
</script>
</body>
</html>
