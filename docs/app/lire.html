<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KanjiYome · Lecteur</title>
<meta name="description" content="Colle un texte japonais : furigana instantané, dictionnaire au clic, niveaux JLPT. 100 % dans ton navigateur.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23C8102E'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>読</text></svg>">
</head>
<body>
<header class="top">
  <div class="wrap top-bar">
    <a class="logo" href="index.html"><span class="seal">読</span>KanjiYome</a>
    <nav>
      <a href="index.html#extension" data-i18n="navExt">Extension</a>
      <a class="cta" href="https://play.google.com/apps/testing/com.kanjiyome.app" data-i18n="navApp">App Android</a>
      <button id="langBtn" class="lang" onclick="kyToggleLang()">EN</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="reader-grid with-panel" id="grid">
    <div>
      <p class="overline" data-i18n="readerTitle">Lecteur</p>
      <p style="color:var(--ink-2);margin-top:0" data-i18n="readerIntro"></p>
      <div class="inputcard">
        <textarea id="input" lang="ja" data-i18n-ph="placeholder" placeholder="Colle ton texte japonais ici…">日本語を勉強しています。今日はいい天気ですね。</textarea>
        <div class="toolbar">
          <button class="btn primary" id="analyzeBtn" disabled data-i18n="analyze">Lire</button>
          <button class="chip" id="furiBtn" aria-pressed="true" data-i18n="furigana">Furigana</button>
          <button class="chip" id="colorBtn" aria-pressed="true" data-i18n="colors">Couleurs JLPT</button>
          <button class="chip" id="sizeDown" aria-label="Texte plus petit">A−</button>
          <button class="chip" id="sizeUp" aria-label="Texte plus grand">A+</button>
          <span class="spacer"></span>
          <span id="status"></span>
          <progress id="dlbar" max="1" value="0" hidden></progress>
        </div>
      </div>
      <div class="output" id="out" style="margin-top:16px">
        <span class="placeholder" data-i18n="outPlaceholder"></span>
      </div>
    </div>
    <aside class="panel">
      <div class="card" id="panelBody"></div>
    </aside>
  </div>
</main>

<script src="i18n.js"></script>
<script src="engine.js"></script>
<script src="loader.js"></script>
<script src="app.js"></script>
</body>
</html>
