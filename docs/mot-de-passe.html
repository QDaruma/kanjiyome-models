<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KanjiYome : nouveau mot de passe</title>
<style>
  body { margin:0; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:#f7f5f0; color:#1c1b1a; display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .card { max-width:26rem; width:100%; margin:1.5rem; padding:2.5rem 2rem; background:#fffdfa; border:1px solid #e3ded4; border-radius:18px; text-align:center; }
  h1 { font-size:1.3rem; margin:0 0 .3rem; }
  h2 { font-size:.9rem; font-weight:500; color:#6f6a61; margin:0 0 1.4rem; }
  input { width:100%; box-sizing:border-box; padding:.85rem 1rem; font-size:1rem; border:1px solid #cfc9bd; border-radius:12px; margin-bottom:.9rem; background:#fbfaf7; }
  button { width:100%; padding:.9rem; font-size:1rem; font-weight:600; color:#fff; background:#c8102e; border:none; border-radius:999px; cursor:pointer; }
  button:disabled { opacity:.5; }
  .msg { margin-top:1rem; font-size:.92rem; line-height:1.45; }
  .ok { color:#2e7d32; font-weight:600; }
  .err { color:#a31515; }
  .en { color:#6f6a61; font-size:.82rem; }
  .brand { margin-top:1.6rem; font-weight:700; color:#c8102e; }
</style>
</head>
<body>
<div class="card">
  <h1>Nouveau mot de passe</h1>
  <h2>Set a new password</h2>
  <form id="f">
    <input id="pw" type="password" minlength="6" required placeholder="Nouveau mot de passe (6+ car.) / New password">
    <input id="pw2" type="password" minlength="6" required placeholder="Confirme le mot de passe / Confirm">
    <button id="go" type="submit">Changer le mot de passe</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="brand">KanjiYome</div>
</div>
<script>
// Le lien Supabase arrive avec les jetons dans le FRAGMENT
// (#access_token=...&type=recovery) : on les lit et on appelle
// PUT /auth/v1/user avec la clé anon (publique par design) + le jeton.
(function () {
  var SUPABASE_URL = 'https://mnzkcsgexmzwqilmwill.supabase.co';
  var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1uemtjc2dleG16d3FpbG13aWxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NzY1ODQsImV4cCI6MjA5NzA1MjU4NH0.RP5GeFiA-1rJHCTzbFScX-6bfn_MRaj6wJJl8_xtIOE';
  var msg = document.getElementById('msg');
  var form = document.getElementById('f');
  var params = new URLSearchParams((location.hash || '#').slice(1));
  var token = params.get('access_token');
  var qerr = new URLSearchParams(location.search).get('error_description');
  if (qerr || !token) {
    form.style.display = 'none';
    msg.innerHTML = '<span class="err">Lien invalide ou expiré. Redemande un e-mail depuis l\'application.</span><br><span class="en">Invalid or expired link. Request a new email from the app.</span>';
    return;
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value;
    var pw2 = document.getElementById('pw2').value;
    if (pw !== pw2) {
      msg.innerHTML = '<span class="err">Les deux mots de passe ne correspondent pas. / Passwords do not match.</span>';
      return;
    }
    var btn = document.getElementById('go');
    btn.disabled = true;
    msg.textContent = '...';
    fetch(SUPABASE_URL + '/auth/v1/user', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'apikey': ANON_KEY,
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({ password: pw })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok) {
          form.style.display = 'none';
          msg.innerHTML = '<span class="ok">Mot de passe changé. Retourne dans l\'application et connecte-toi.</span><br><span class="en">Password changed. Go back to the app and sign in.</span>';
        } else {
          btn.disabled = false;
          var d = (res.j && (res.j.msg || res.j.message || res.j.error_description)) || 'Erreur inconnue';
          msg.innerHTML = '<span class="err">Échec : ' + String(d).slice(0, 160) + '</span>';
        }
      })
      .catch(function () {
        btn.disabled = false;
        msg.innerHTML = '<span class="err">Réseau indisponible, réessaie. / Network error, try again.</span>';
      });
  });
})();
</script>
</body>
</html>
